<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F59E0B" />
    <title>JobQuest Offline</title>
    <style>
      :root {
        --bg: #1a1410;
        --surface: #241c16;
        --text: #f5e6d3;
        --accent: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(90vw, 440px);
        background: var(--surface);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 28px 22px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f59e0b, #fbbf24);
        color: #1a1410;
        font-weight: 800;
        font-size: 2rem;
      }
      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { margin: 0; color: #d7c4a3; line-height: 1.6; }
      button {
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #1a1410;
        font-weight: 800;
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">J</div>
      <h1>You're offline</h1>
      <p>Check your connection and try again. Saved job tracking data is still available when you reconnect.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
